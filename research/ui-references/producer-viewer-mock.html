<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Producer 뷰어 목업 — 타이틀 페이지 / 도감 / 퀘스트 저널</title>
<style>
  /* ── tale-studio dark 토큰 미러 (src/app/globals.css 와 1:1 스왑 가능) ── */
  :root {
    --background: oklch(0.156 0 0);        /* #121212 */
    --card: oklch(0.185 0 0);              /* #1a1a1a */
    --popover: oklch(0.222 0 0);
    --muted: oklch(0.243 0 0);
    --muted-fg: oklch(0.762 0 0);
    --fg: oklch(1 0 0);
    --primary: oklch(0.537 0.234 29.23);   /* Netflix red */
    --chat-user-bubble: oklch(0.36 0.09 29);
    --success: oklch(0.696 0.17 162.48);
    --border: rgba(255,255,255,.10);
    --border-strong: rgba(255,255,255,.24);
    --stage-producer: oklch(0.606 0.25 292.717);
    --stage-writer: oklch(0.623 0.214 259.815);
    --stage-artist: oklch(0.769 0.188 70.08);
    --stage-director: oklch(0.645 0.246 16.439);
    --stage-editor: oklch(0.696 0.17 162.48);
    --r-panel: 16px; --r-card: 12px; --r-pill: 999px;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  html, body { height: 100%; }
  body {
    background: var(--background); color: var(--fg);
    font-family: Pretendard, -apple-system, "Apple SD Gothic Neo", "Segoe UI", sans-serif;
    font-size: 14px; overflow: hidden;
  }

  /* ── 상단 목업 컨트롤 바 (목업 전용 — 실제 UI 아님) ── */
  .mockbar {
    display: flex; align-items: center; gap: 10px;
    padding: 8px 14px; border-bottom: 1px dashed var(--border-strong);
    background: rgba(255,255,255,.03); font-size: 12px; color: var(--muted-fg);
  }
  .mockbar b { color: var(--fg); font-weight: 700; }
  .tabs { display: flex; gap: 4px; margin-left: 14px; }
  .tab {
    border: 1px solid var(--border); background: transparent; color: var(--muted-fg);
    padding: 5px 12px; border-radius: var(--r-pill); font-size: 12px; cursor: pointer;
  }
  .tab.on { background: var(--stage-producer); border-color: transparent; color: #fff; font-weight: 700; }
  .mockbar .spacer { flex: 1; }
  .ctl {
    border: 1px solid var(--border); background: var(--card); color: var(--fg);
    padding: 5px 12px; border-radius: var(--r-pill); font-size: 12px; cursor: pointer;
  }
  .ctl.primary { background: var(--primary); border-color: transparent; font-weight: 700; }
  .ctl:disabled { opacity: .4; cursor: default; }

  /* ── 스튜디오 셸 (현행 유지 가정 — 정적 목킹) ── */
  .shell { display: flex; gap: 8px; padding: 8px; height: calc(100vh - 38px); }
  .rail {
    width: 76px; border: 1px solid var(--border); border-radius: var(--r-panel);
    background: var(--card); display: flex; flex-direction: column; align-items: center;
    padding: 12px 0; gap: 6px; flex-shrink: 0;
  }
  .rail .st {
    width: 56px; padding: 8px 0; border-radius: 10px; text-align: center;
    color: var(--muted-fg); font-size: 10px; line-height: 1.3;
  }
  .rail .st .dot { width: 26px; height: 26px; border-radius: 8px; margin: 0 auto 4px; background: var(--muted); }
  .rail .st.on { background: color-mix(in oklab, var(--stage-producer) 15%, transparent); color: var(--fg); }
  .rail .st.on .dot { background: var(--stage-producer); }

  .main {
    flex: 1; border: 1px solid var(--border); border-radius: var(--r-panel);
    background: var(--card); overflow-y: auto; position: relative;
  }
  .main-inner { padding: 26px 30px 60px; max-width: 980px; margin: 0 auto; }

  /* ── 우측 채팅 패널 (현행 새 채팅 UI 목킹) ── */
  .chat {
    width: 330px; flex-shrink: 0; border: 1px solid var(--border); border-radius: var(--r-panel);
    background: var(--card); display: flex; flex-direction: column;
  }
  .chat-h { padding: 10px 14px; border-bottom: 1px solid var(--border); font-size: 13px; font-weight: 700; }
  .chat-h small { display: block; font-weight: 400; font-size: 10px; color: var(--muted-fg); }
  .chat-b { flex: 1; overflow-y: auto; padding: 10px 12px; display: flex; flex-direction: column; gap: 8px; }
  .roleplate {
    display: flex; align-items: center; gap: 8px; height: 26px; margin-top: 12px;
    border-radius: 14px; padding-left: 2px;
    background: linear-gradient(90deg, color-mix(in oklab, var(--stage-producer) 28%, transparent), transparent);
    font-size: 12px; font-weight: 800;
  }
  .face { width: 22px; height: 22px; border-radius: 50%; background: var(--stage-producer); position: relative; flex-shrink: 0; }
  .face::before { content:""; position:absolute; left:5px; top:7px; width:3.5px; height:5px; border-radius:2px; background:#121212; }
  .face::after  { content:""; position:absolute; right:5px; top:7px; width:3.5px; height:5px; border-radius:2px; background:#121212; }
  .m-ai { font-size: 12px; line-height: 1.55; color: var(--fg); padding: 0 2px; white-space: pre-wrap; }
  .m-user {
    align-self: flex-end; max-width: 85%;
    background: var(--chat-user-bubble); color: oklch(0.96 0.005 30);
    padding: 8px 12px; border-radius: 18px 18px 4px 18px; font-size: 12px; line-height: 1.5;
  }
  .chat-f { padding: 10px; }
  .chat-input {
    border: 1px solid var(--border); border-radius: 18px; background: var(--background);
    padding: 10px 12px 8px; font-size: 12px; color: rgba(255,255,255,.34);
  }
  .chat-tools { display: flex; align-items: center; gap: 6px; margin-top: 8px; }
  .agent-pill {
    display: inline-flex; align-items: center; gap: 5px; font-size: 11px; font-weight: 600;
    border: 1px solid color-mix(in oklab, var(--stage-producer) 30%, transparent);
    color: var(--stage-producer); background: color-mix(in oklab, var(--stage-producer) 15%, transparent);
    padding: 3px 8px; border-radius: 8px;
  }
  .send { margin-left: auto; width: 26px; height: 26px; border-radius: 50%; background: rgba(255,255,255,.12); display:flex; align-items:center; justify-content:center; font-size: 13px; color: rgba(255,255,255,.5); }

  /* ════════ 여기부터가 제안 — Producer 뷰어 ════════ */

  /* 공통: pill (설정 슬롯) — 빈 상태 = 점선, 채워지면 점등 */
  .pills { display: flex; flex-wrap: wrap; gap: 8px; }
  .pill {
    display: inline-flex; align-items: center; gap: 6px;
    padding: 6px 14px; border-radius: var(--r-pill); font-size: 12px;
    border: 1.5px dashed var(--border-strong); color: var(--muted-fg);
    transition: all .25s ease;
  }
  .pill .k { font-size: 10px; opacity: .6; }
  .pill.filled {
    border: 1.5px solid transparent; color: #fff; font-weight: 600;
    background: color-mix(in oklab, var(--stage-producer) 26%, var(--card));
    animation: pop .35s ease;
  }
  @keyframes pop { 0% { transform: scale(.85); opacity: 0; } 60% { transform: scale(1.06); } 100% { transform: scale(1); } }

  /* 변형 A: 타이틀 페이지 히어로 */
  .hero {
    border-radius: var(--r-panel); padding: 34px 30px 26px; margin-bottom: 22px;
    background:
      radial-gradient(120% 160% at 85% -20%, color-mix(in oklab, var(--stage-producer) 22%, transparent), transparent 60%),
      linear-gradient(180deg, rgba(255,255,255,.04), transparent);
    border: 1px solid var(--border);
  }
  .hero .kicker { font-size: 11px; letter-spacing: .16em; text-transform: uppercase; color: var(--stage-producer); font-weight: 700; margin-bottom: 10px; }
  .hero h1 { font-size: 34px; font-weight: 800; letter-spacing: -0.02em; }
  .hero h1.empty { color: rgba(255,255,255,.22); font-weight: 700; }
  .hero .logline { margin: 10px 0 18px; font-size: 14px; line-height: 1.6; color: var(--muted-fg); max-width: 640px; min-height: 22px; }
  .hero .logline.empty { color: rgba(255,255,255,.2); font-style: italic; }

  /* 공통: 스트립 (캐스트/로케이션 = 도감 슬롯) */
  .section { margin-bottom: 26px; }
  .section > .sh { display: flex; align-items: baseline; gap: 8px; margin-bottom: 12px; }
  .section > .sh h2 { font-size: 13px; font-weight: 700; letter-spacing: .02em; }
  .section > .sh .cnt { font-size: 11px; color: var(--muted-fg); }
  .strip { display: flex; gap: 14px; flex-wrap: wrap; }
  .slot { width: 92px; text-align: center; cursor: pointer; background: none; border: none; color: inherit; font-family: inherit; }
  .slot .avatar {
    width: 72px; height: 72px; border-radius: 50%; margin: 0 auto 7px; position: relative;
    display: flex; align-items: center; justify-content: center; font-size: 22px; font-weight: 800;
    border: 2px dashed var(--border-strong); color: rgba(255,255,255,.25);
    transition: all .25s ease;
  }
  .slot.loc .avatar { border-radius: 14px; }
  .slot .nm { font-size: 11px; color: var(--muted-fg); line-height: 1.3; }
  .slot .rl { font-size: 9px; color: rgba(255,255,255,.35); }
  .slot.filled .avatar {
    border: 2px solid color-mix(in oklab, var(--stage-producer) 55%, transparent);
    background: linear-gradient(145deg, color-mix(in oklab, var(--stage-producer) 38%, var(--card)), var(--card));
    color: #fff; animation: pop .4s ease;
  }
  .slot.filled .nm { color: var(--fg); font-weight: 600; }
  .slot.filled .avatar::after {
    content: "✓"; position: absolute; right: -2px; bottom: -2px;
    width: 20px; height: 20px; border-radius: 50%; background: var(--success); color: #08130e;
    font-size: 11px; font-weight: 800; display: flex; align-items: center; justify-content: center;
    border: 2px solid var(--card);
  }
  .slot:hover .avatar { border-color: var(--border-strong); transform: translateY(-2px); }
  .slot.filled:hover .avatar { border-color: var(--stage-producer); }

  /* 공통: 퀘스트 트래커 (게이트 hardMissing 매핑) */
  .quest {
    border: 1px solid var(--border); border-radius: var(--r-panel);
    background: rgba(255,255,255,.03); padding: 16px 18px;
  }
  .quest .qh { display: flex; align-items: center; gap: 10px; margin-bottom: 12px; }
  .quest .qh h2 { font-size: 13px; font-weight: 700; }
  .qbar { flex: 1; height: 5px; border-radius: 99px; background: var(--muted); overflow: hidden; }
  .qbar > div { height: 100%; border-radius: 99px; background: linear-gradient(90deg, var(--stage-producer), var(--stage-writer)); transition: width .5s ease; }
  .qbar-label { font-size: 11px; color: var(--muted-fg); }
  .qitem { display: flex; align-items: center; gap: 10px; padding: 7px 2px; font-size: 12.5px; color: var(--muted-fg); }
  .qitem .chk {
    width: 18px; height: 18px; border-radius: 50%; border: 1.5px solid var(--border-strong);
    display: flex; align-items: center; justify-content: center; font-size: 10px; flex-shrink: 0;
    transition: all .25s ease;
  }
  .qitem.done { color: rgba(255,255,255,.4); }
  .qitem.done .chk { background: var(--success); border-color: var(--success); color: #08130e; font-weight: 800; animation: pop .35s ease; }
  .qitem.done .lb { text-decoration: line-through; text-decoration-color: rgba(255,255,255,.25); }
  .reward { margin-top: 12px; }
  .reward button {
    width: 100%; padding: 11px; border-radius: var(--r-pill); border: none; cursor: pointer;
    background: var(--primary); color: #fff; font-weight: 700; font-size: 13px; font-family: inherit;
    opacity: .25; pointer-events: none; transition: all .3s ease;
  }
  .reward.open button { opacity: 1; pointer-events: auto; animation: glowpulse 2s ease infinite; }
  @keyframes glowpulse { 0%,100% { box-shadow: 0 0 0 0 color-mix(in oklab, var(--primary) 45%, transparent); } 50% { box-shadow: 0 0 22px 2px color-mix(in oklab, var(--primary) 45%, transparent); } }
  .reward .hint { text-align: center; font-size: 10.5px; color: var(--muted-fg); margin-top: 6px; }

  /* 변형 A 배치: 히어로 아래 2열 (스트립 / 트래커) */
  .layoutA .below { display: grid; grid-template-columns: 1fr 280px; gap: 22px; align-items: start; }

  /* 변형 B: 도감 그리드 */
  .layoutB .titleline { display: flex; align-items: center; gap: 14px; margin-bottom: 6px; }
  .layoutB .titleline h1 { font-size: 22px; font-weight: 800; }
  .layoutB .titleline h1.empty { color: rgba(255,255,255,.22); }
  .layoutB .logline { font-size: 12.5px; color: var(--muted-fg); margin-bottom: 16px; min-height: 18px; }
  .layoutB .logline.empty { color: rgba(255,255,255,.2); font-style: italic; }
  .layoutB .grid2 { display: grid; grid-template-columns: 1fr 1fr; gap: 20px; margin-top: 20px; }
  .layoutB .codex { border: 1px solid var(--border); border-radius: var(--r-panel); padding: 16px; background: rgba(255,255,255,.02); }

  /* 변형 C: 퀘스트 저널 (세로 여정) */
  .layoutC { display: grid; grid-template-columns: 300px 1fr; gap: 26px; }
  .journey { position: relative; padding-left: 26px; }
  .journey::before { content: ""; position: absolute; left: 11px; top: 8px; bottom: 8px; width: 2px; background: var(--muted); }
  .jnode { position: relative; padding: 0 0 26px 12px; }
  .jnode .nub {
    position: absolute; left: -26px; top: 0; width: 24px; height: 24px; border-radius: 50%;
    background: var(--muted); border: 2px solid var(--card); display: flex; align-items: center; justify-content: center;
    font-size: 11px; font-weight: 800; color: var(--muted-fg); transition: all .3s ease; z-index: 1;
  }
  .jnode h3 { font-size: 13px; font-weight: 700; color: var(--muted-fg); }
  .jnode p { font-size: 11px; color: rgba(255,255,255,.35); margin-top: 3px; line-height: 1.5; }
  .jnode.done .nub { background: var(--success); color: #08130e; }
  .jnode.done h3 { color: rgba(255,255,255,.45); text-decoration: line-through; text-decoration-color: rgba(255,255,255,.2); }
  .jnode.now .nub { background: var(--stage-producer); color: #fff; box-shadow: 0 0 0 4px color-mix(in oklab, var(--stage-producer) 25%, transparent); }
  .jnode.now h3 { color: var(--fg); }

  /* 캐릭터 디테일 팝업 (카드 그리드의 대체재) */
  .overlay {
    position: fixed; inset: 0; background: rgba(0,0,0,.6); backdrop-filter: blur(4px);
    display: none; align-items: center; justify-content: center; z-index: 50;
  }
  .overlay.on { display: flex; }
  .sheet {
    width: 400px; max-width: calc(100vw - 40px); border-radius: var(--r-panel);
    background: var(--popover); border: 1px solid var(--border-strong);
    padding: 22px; animation: pop .25s ease;
  }
  .sheet .top { display: flex; gap: 14px; align-items: center; margin-bottom: 16px; }
  .sheet .avatar {
    width: 64px; height: 64px; border-radius: 50%; flex-shrink: 0;
    background: linear-gradient(145deg, color-mix(in oklab, var(--stage-producer) 38%, var(--card)), var(--card));
    border: 2px solid color-mix(in oklab, var(--stage-producer) 55%, transparent);
    display: flex; align-items: center; justify-content: center; font-size: 20px; font-weight: 800;
  }
  .sheet h2 { font-size: 18px; font-weight: 800; }
  .sheet .role { font-size: 11px; color: var(--stage-producer); font-weight: 700; }
  .sheet dl { display: grid; grid-template-columns: 74px 1fr; gap: 7px 10px; font-size: 12.5px; }
  .sheet dt { color: var(--muted-fg); font-size: 11px; padding-top: 1px; }
  .sheet dd { line-height: 1.5; }
  .sheet .arc { display: flex; align-items: center; gap: 6px; }
  .sheet .arc .a { padding: 2px 8px; border-radius: 99px; background: var(--muted); font-size: 11px; }
  .sheet .foot { margin-top: 16px; display: flex; gap: 8px; }
  .sheet .foot button {
    flex: 1; padding: 8px; border-radius: 10px; font-size: 12px; cursor: pointer; font-family: inherit;
    border: 1px solid var(--border); background: transparent; color: var(--fg);
  }
  .sheet .foot .note { font-size: 10px; color: var(--muted-fg); text-align: center; margin-top: 8px; }

  /* 마일스톤 토스트 */
  .toasts { position: fixed; bottom: 22px; left: 50%; transform: translateX(-50%); display: flex; flex-direction: column; gap: 6px; z-index: 60; pointer-events: none; }
  .toast {
    background: var(--popover); border: 1px solid var(--border-strong); border-radius: 10px;
    padding: 8px 14px; font-size: 12px; display: flex; gap: 8px; align-items: center;
    animation: toastin .3s ease, toastout .4s ease 2.2s forwards;
  }
  .toast .tick { color: var(--success); font-weight: 800; }
  @keyframes toastin { from { opacity: 0; transform: translateY(8px); } }
  @keyframes toastout { to { opacity: 0; transform: translateY(-6px); } }

  .footnote { margin-top: 34px; padding-top: 14px; border-top: 1px dashed var(--border); font-size: 11px; color: var(--muted-fg); line-height: 1.7; }
</style>
</head>
<body>

<div class="mockbar">
  <b>Producer 뷰어 목업</b> — 셸·채팅은 현행 유지 가정, 가운데만 교체
  <div class="tabs">
    <button class="tab on" data-v="A">A 타이틀 페이지</button>
    <button class="tab" data-v="B">B 도감 그리드</button>
    <button class="tab" data-v="C">C 퀘스트 저널</button>
  </div>
  <div class="spacer"></div>
  <button class="ctl primary" id="step">▸ 다음 발화 시뮬레이션</button>
  <button class="ctl" id="reset">처음부터</button>
</div>

<div class="shell">
  <!-- 좌측 레일 (현행) -->
  <nav class="rail">
    <div class="st on"><div class="dot"></div>Producer</div>
    <div class="st"><div class="dot"></div>Writer</div>
    <div class="st"><div class="dot"></div>Artist</div>
    <div class="st"><div class="dot"></div>Director</div>
    <div class="st"><div class="dot"></div>Editor</div>
  </nav>

  <!-- 가운데: 제안 뷰어 -->
  <main class="main"><div class="main-inner" id="viewer"></div></main>

  <!-- 우측 채팅 (현행 새 채팅 UI 목킹) -->
  <aside class="chat">
    <div class="chat-h">에이전트 채팅 <small>모든 단계가 이어지는 하나의 대화</small></div>
    <div class="chat-b" id="chatlog"></div>
    <div class="chat-f">
      <div class="chat-input">스토리에 대해 말해주세요…
        <div class="chat-tools"><span class="agent-pill">● Producer ▾</span><span class="send">↑</span></div>
      </div>
    </div>
  </aside>
</div>

<!-- 캐릭터/장소 디테일 팝업 -->
<div class="overlay" id="overlay">
  <div class="sheet" id="sheet"></div>
</div>

<div class="toasts" id="toasts"></div>

<script>
'use strict';
/* ── 상태: 실제 앱의 producer-store 필드에 1:1 매핑되는 목업 상태 ── */
const initial = () => ({
  title: null, logline: null,
  pills: [
    { id:'genre',    k:'장르',     v:null },
    { id:'playtime', k:'러닝타임', v:null },
    { id:'format',   k:'포맷',     v:null },
    { id:'tone',     k:'톤',       v:null },
    { id:'lang',     k:'대사 언어', v:null },
  ],
  cast: [ emptySlot(), emptySlot(), emptySlot() ],
  locations: [ emptySlot(), emptySlot(), emptySlot() ],
  quests: [
    { id:'q-genre', label:'장르·러닝타임·포맷 확정', done:false },
    { id:'q-story', label:'이야기 아크 (시작 → 사건 → 결말)', done:false },
    { id:'q-cast',  label:'주인공 1명 이상', done:false },
    { id:'q-loc',   label:'배경 1개 이상 (이름·모습·용도)', done:false },
  ],
});
function emptySlot() { return { filled:false, name:null, role:null, appearance:null, arc:null, motivation:null }; }
let S = initial();
let variant = 'A';
let stepIdx = 0;

/* ── 시뮬레이션 대본 — producer 시스템 프롬프트의 예제 시나리오 그대로 ── */
const SCRIPT = [
  {
    chat: [
      { who:'plate' },
      { who:'ai', text:'안녕하세요! 저는 당신의 AI 프로듀서예요. 만들고 싶은 이야기를 편하게 한 줄로 들려주세요. 장르, 주인공, 지금 떠오르는 한 장면, 무엇이든 좋아요!' },
    ],
    apply: () => {},
  },
  {
    chat: [
      { who:'user', text:'30초 스릴러 숏폼, 어두운 골목에서 쫓기는 장면, 세로 영상' },
      { who:'plate' },
      { who:'ai', text:'좋은 출발점이에요! 설정을 잡아볼게요. 주인공은 어떤 사람인가요? 나이·복장을 알려주시면 일관된 캐릭터를 만들 수 있어요.' },
    ],
    apply: () => {
      fillPill('genre','스릴러'); fillPill('playtime','30초'); fillPill('format','9:16 세로');
      fillPill('tone','어둡고 긴장감'); fillPill('lang','한국어');
      fillSlot(S.locations,0,{ name:'어두운 골목', role:'추격 시작점', appearance:'젖은 아스팔트, 깜빡이는 간판, 좁은 골목' });
      questDone('q-genre'); questDone('q-loc');
      S.title = '무제 스릴러'; 
      toast('장르·러닝타임·포맷 확정');
      toast('배경 등록 — 어두운 골목');
    },
  },
  {
    chat: [
      { who:'user', text:'주인공은 20대 여성, 검은 후디에 운동화. 네온 뒷골목에서 시작해서 막다른 옥상에서 그림자랑 마주보는 게 결말이야' },
      { who:'plate' },
      { who:'ai', text:'완벽해요! 이제 씬으로 나눌 수 있겠습니다. 캐릭터·장소·아크가 모두 갖춰졌어요.' },
    ],
    apply: () => {
      fillSlot(S.cast,0,{ name:'후디 여성', role:'주인공', appearance:'20대 여성, 검은 후디, 운동화',
        arc:['도주','정면 대면'], motivation:'추격자를 따돌린다 → 두려움을 직면한다' });
      fillSlot(S.cast,1,{ name:'그림자', role:'적대자', appearance:'정체불명의 어두운 실루엣', arc:null, motivation:null });
      fillSlot(S.locations,0,{ name:'네온 뒷골목', role:'추격 시작점', appearance:'네온 간판이 젖은 아스팔트에 반사되는 좁고 어두운 골목' });
      fillSlot(S.locations,1,{ name:'막다른 옥상', role:'결말 공간', appearance:'낮은 난간과 비상계단 출구만 있는 차갑고 텅 빈 옥상' });
      S.title = '네온 추격';
      S.logline = '네온이 번지는 뒷골목, 검은 후디의 여자가 정체불명의 그림자에게 쫓기다 막다른 옥상에서 도망을 멈추고 돌아선다.';
      questDone('q-cast'); questDone('q-story');
      toast('주인공 등록 — 후디 여성');
      toast('스토리 아크 완성');
    },
  },
  {
    chat: [
      { who:'plate' },
      { who:'ai', text:'필요한 항목이 모두 채워졌어요. Writer를 호출하면 씬·샷 설계가 바로 시작돼요.' },
    ],
    apply: () => { toast('모든 마일스톤 달성 — Writer 호출 가능'); },
  },
];

/* ── 상태 조작 헬퍼 ── */
function fillPill(id, v) { const p = S.pills.find(p=>p.id===id); if (p) p.v = v; }
function fillSlot(arr, i, data) { arr[i] = { filled:true, ...data }; }
function questDone(id) { const q = S.quests.find(q=>q.id===id); if (q) q.done = true; }
const gateOpen = () => S.quests.every(q=>q.done);

/* ── 렌더 ── */
const viewer = document.getElementById('viewer');

function pillsHtml() {
  return '<div class="pills">' + S.pills.map(p => p.v
    ? `<span class="pill filled"><span class="k">${p.k}</span>${p.v}</span>`
    : `<span class="pill"><span class="k">${p.k}</span>비어 있음</span>`
  ).join('') + '</div>';
}
function slotHtml(s, i, kind) {
  const cls = 'slot' + (kind==='loc' ? ' loc' : '') + (s.filled ? ' filled' : '');
  const face = s.filled ? s.name.slice(0,1) : '?';
  const nm = s.filled ? s.name : (kind==='loc' ? '미등록 장소' : '미등록 인물');
  const rl = s.filled && s.role ? s.role : '&nbsp;';
  return `<button class="${cls}" data-kind="${kind}" data-i="${i}">
    <span class="avatar">${face}</span>
    <span class="nm">${nm}</span><br><span class="rl">${rl}</span>
  </button>`;
}
function stripHtml(arr, kind, label) {
  const n = arr.filter(s=>s.filled).length;
  return `<div class="section"><div class="sh"><h2>${label}</h2><span class="cnt">${n} / ${arr.length}</span></div>
    <div class="strip">${arr.map((s,i)=>slotHtml(s,i,kind)).join('')}</div></div>`;
}
function questHtml() {
  const done = S.quests.filter(q=>q.done).length;
  const pct = Math.round(done / S.quests.length * 100);
  return `<div class="quest">
    <div class="qh"><h2>다음 마일스톤</h2><div class="qbar"><div style="width:${pct}%"></div></div><span class="qbar-label">${done}/${S.quests.length}</span></div>
    ${S.quests.map(q=>`<div class="qitem ${q.done?'done':''}"><span class="chk">${q.done?'✓':''}</span><span class="lb">${q.label}</span></div>`).join('')}
    <div class="reward ${gateOpen()?'open':''}">
      <button onclick="callWriter()">Writer 호출하기</button>
      <div class="hint">${gateOpen() ? '모든 재료가 준비됐어요 — 씬·샷 설계를 시작할 수 있어요' : '마일스톤을 채우면 Writer를 호출할 수 있어요'}</div>
    </div>
  </div>`;
}
function titleHtml(big) {
  const t = S.title ? `<h1>${S.title}</h1>` : `<h1 class="empty">아직 제목이 없는 이야기</h1>`;
  const l = S.logline ? `<div class="logline">${S.logline}</div>` : `<div class="logline empty">채팅에 떠오르는 장면 하나를 던져 보세요 — 여기에서 영화가 조립돼요.</div>`;
  return big
    ? `<div class="hero"><div class="kicker">Now assembling</div>${t}${l}${pillsHtml()}</div>`
    : `<div class="titleline">${t}</div>${l}${pillsHtml()}`;
}

function render() {
  let html = '';
  if (variant === 'A') {
    html = `<div class="layoutA">${titleHtml(true)}
      <div class="below">
        <div>${stripHtml(S.cast,'cast','캐스트')}${stripHtml(S.locations,'loc','로케이션')}</div>
        ${questHtml()}
      </div></div>`;
  } else if (variant === 'B') {
    html = `<div class="layoutB">${titleHtml(false)}
      <div class="grid2">
        <div class="codex">${stripHtml(S.cast,'cast','캐스트 도감')}</div>
        <div class="codex">${stripHtml(S.locations,'loc','로케이션 도감')}</div>
      </div>
      <div style="margin-top:20px">${questHtml()}</div></div>`;
  } else {
    const nodes = [
      { h:'이야기 씨앗',  p:'장면 하나, 기분 하나면 충분해요', done: !!S.title },
      { h:'설정 확정',    p:'장르 · 러닝타임 · 포맷', done: S.quests[0].done },
      { h:'주인공 등장',  p:'모습이 그려지는 인물 1명', done: S.quests[2].done },
      { h:'무대 완성',    p:'이름·모습·용도가 있는 배경', done: S.quests[3].done },
      { h:'Writer 호출',  p:'씬·샷 설계로 핸드오프', done: false },
    ];
    const nowIdx = nodes.findIndex(n=>!n.done);
    html = `<div class="layoutC">
      <div><div class="journey">${nodes.map((n,i)=>`
        <div class="jnode ${n.done?'done':''} ${i===nowIdx?'now':''}">
          <div class="nub">${n.done?'✓':i+1}</div><h3>${n.h}</h3><p>${n.p}</p>
        </div>`).join('')}</div>
        <div style="margin-top:6px">${gateOpen() ? `<div class="reward open"><button onclick="callWriter()">Writer 호출하기</button></div>` : ''}</div>
      </div>
      <div>${titleHtml(true)}${stripHtml(S.cast,'cast','캐스트')}${stripHtml(S.locations,'loc','로케이션')}</div>
    </div>`;
  }
  html += `<div class="footnote">
    <b>레퍼런스 매핑</b> — 타이틀 히어로: 넷플릭스 타이틀 페이지 · 슬롯 스트립: 도감/파티 편성(실루엣→점등, 클릭=시트 팝업)
    · 다음 마일스톤: 게임 퀘스트 트래커(= evaluateProducerGate hardMissing 재사용) · 저널 여정: Duolingo 경로.
    입력 폼은 화면에 없음 — 편집은 팝업 안에서만, 기본 동선은 채팅.
  </div>`;
  viewer.innerHTML = html;
  viewer.querySelectorAll('.slot').forEach(el => el.addEventListener('click', () => openSheet(el.dataset.kind, +el.dataset.i)));
}

/* ── 팝업 (카드 그리드 대체) ── */
const overlay = document.getElementById('overlay');
const sheet = document.getElementById('sheet');
function openSheet(kind, i) {
  const s = (kind==='cast' ? S.cast : S.locations)[i];
  if (!s.filled) { toast(kind==='cast' ? '채팅에 인물을 한 줄 던져 보세요 — "20대 여성, 검은 후디…"' : '채팅에 장소를 한 줄 던져 보세요 — "네온이 번지는 뒷골목"', '·'); return; }
  sheet.innerHTML = `
    <div class="top"><div class="avatar">${s.name.slice(0,1)}</div>
      <div><div class="role">${s.role ?? ''}</div><h2>${s.name}</h2></div></div>
    <dl>
      <dt>${kind==='cast'?'외형':'모습'}</dt><dd>${s.appearance ?? '—'}</dd>
      ${s.arc ? `<dt>아크</dt><dd class="arc"><span class="a">${s.arc[0]}</span>→<span class="a">${s.arc[1]}</span></dd>` : ''}
      ${s.motivation ? `<dt>동기</dt><dd>${s.motivation}</dd>` : ''}
    </dl>
    <div class="foot"><button onclick="closeSheet()">닫기</button><button>✎ 직접 수정</button></div>
    <div class="note">디테일 편집은 이 팝업 안에만 — 화면의 기본 동선은 채팅</div>`;
  overlay.classList.add('on');
}
function closeSheet() { overlay.classList.remove('on'); }
overlay.addEventListener('click', (e) => { if (e.target === overlay) closeSheet(); });

/* ── 채팅 목킹 ── */
const chatlog = document.getElementById('chatlog');
function pushChat(items) {
  for (const m of items) {
    const el = document.createElement('div');
    if (m.who === 'plate') { el.className = 'roleplate'; el.innerHTML = '<span class="face"></span>Producer'; }
    else if (m.who === 'ai') { el.className = 'm-ai'; el.textContent = m.text; }
    else { el.className = 'm-user'; el.textContent = m.text; }
    chatlog.appendChild(el);
  }
  chatlog.scrollTop = chatlog.scrollHeight;
}

/* ── 토스트 ── */
function toast(msg, tick = '✓') {
  const t = document.createElement('div');
  t.className = 'toast'; t.innerHTML = `<span class="tick">${tick}</span>${msg}`;
  document.getElementById('toasts').appendChild(t);
  setTimeout(() => t.remove(), 2700);
}

/* ── Writer 호출 (⇄ 초대 연출 목킹) ── */
function callWriter() {
  pushChat([{ who:'user', text:'Writer로 넘겨주세요' }, { who:'ai', text:'Writer에게 넘겼어요. 씬·샷 생성을 시작할게요.' }]);
  const inv = document.createElement('div');
  inv.style.cssText = 'text-align:center; padding:12px 0; font-size:11px; color:var(--muted-fg); animation: pop .5s ease;';
  inv.innerHTML = `<div style="display:flex;justify-content:center;align-items:center;gap:10px;margin-bottom:6px;">
    <span class="face" style="width:24px;height:24px;"></span><span style="opacity:.5">→</span>
    <span class="face" style="width:32px;height:32px;background:var(--stage-writer)"></span></div>
    <span style="color:var(--stage-producer);font-weight:700">@Producer</span>가
    <span style="color:var(--stage-writer);font-weight:700">@Writer</span>를 채팅에 초대했어요`;
  chatlog.appendChild(inv);
  chatlog.scrollTop = chatlog.scrollHeight;
  toast('Writer 호출 — 씬·샷 설계 시작 (실제로는 1.6초 뒤 Writer 탭으로 슬라이드)');
}

/* ── 컨트롤 ── */
document.getElementById('step').addEventListener('click', () => {
  if (stepIdx >= SCRIPT.length) { toast('대본 끝 — [처음부터]로 리셋', '·'); return; }
  const st = SCRIPT[stepIdx++];
  pushChat(st.chat);
  st.apply();
  render();
  document.getElementById('step').textContent =
    stepIdx >= SCRIPT.length ? '대본 끝' : `▸ 다음 발화 시뮬레이션 (${stepIdx}/${SCRIPT.length - 1})`;
});
document.getElementById('reset').addEventListener('click', () => {
  S = initial(); stepIdx = 0; chatlog.innerHTML = '';
  document.getElementById('step').textContent = '▸ 다음 발화 시뮬레이션';
  render();
  document.getElementById('step').click(); // 웰컴부터
});
document.querySelectorAll('.tab').forEach(t => t.addEventListener('click', () => {
  document.querySelectorAll('.tab').forEach(x=>x.classList.remove('on'));
  t.classList.add('on'); variant = t.dataset.v; render();
}));

/* 부팅: 웰컴 스텝 자동 재생 */
render();
document.getElementById('step').click();
</script>
</body>
</html>
